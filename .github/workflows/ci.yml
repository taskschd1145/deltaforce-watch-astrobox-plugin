name: V4 plugin checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: wasm32-wasip2
      - name: Test models, exports and layouts
        run: node scripts/cargo.mjs test --locked --all-targets
      - name: Build API Level 4 component and ABP
        run: python3 scripts/build_dist.py --release --package
      - uses: actions/upload-artifact@v4
        with:
          name: deltaforce-sync-demo
          path: dist/
