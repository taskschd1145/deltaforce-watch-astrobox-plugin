[package]
name = "deltaforce-watch-astrobox-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["taskschd1145"]
repository = "https://github.com/taskschd1145/deltaforce-watch-astrobox-plugin"
description = "三角洲行动同步器 · AstroBox V4 界面演示与离线快照"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
codegen-units = 1
panic = "abort"
